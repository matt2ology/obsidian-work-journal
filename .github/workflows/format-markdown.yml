name: Format Markdown with Prettier

on:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    format-markdown:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Cache Prettier
              uses: actions/cache@v4
              id: prettier-cache
              with:
                  path: |
                      ~/.npm
                      /usr/local/lib/node_modules
                  key: ${{ runner.os }}-prettier-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-prettier-

            - name: Install Prettier
              run: npm install --global prettier
              if: steps.prettier-cache.outputs.cache-hit != 'true'

            - name: Run Prettier on Markdown
              run: prettier --write "**/*.md" --tab-width 4 --use-tabs=false --loglevel warn

            - name: Commit and push changes
              if: success()
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: format markdown with prettier (4 spaces)"
                    git push
                    echo "Changes committed and pushed"
                  fi
